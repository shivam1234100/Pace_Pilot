services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: pace
      POSTGRES_PASSWORD: pace
      POSTGRES_DB: pace
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # -h forces TCP, which only comes up after initdb scripts have finished.
      test: ["CMD-SHELL", "pg_isready -h localhost -U pace -d pace"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://pace:pace@db:5432/pace
      REDIS_URL: redis://redis:6379/0
      COUNTER_MODE: ${COUNTER_MODE:-atomic}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
